<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Hors ligne</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f4f6fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #1f2937;
  }
  .card {
    max-width: 380px;
    width: 100%;
    background: #ffffff;
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(30, 79, 168, 0.08);
  }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: #e8edfb;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 8px;
    color: #1e4fa8;
  }
  p {
    font-size: 14px;
    line-height: 1.5;
    color: #4b5563;
    margin: 0 0 20px;
  }
  button {
    appearance: none;
    border: none;
    background: #1e4fa8;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 10px;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3L21 21" stroke="#1e4fa8" stroke-width="2" stroke-linecap="round"/>
        <path d="M8.5 8.5C5.5 9.5 3.5 11.5 2 13.5" stroke="#1e4fa8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
        <path d="M12 5C15.5 5 18.7 6.4 21 8.7" stroke="#1e4fa8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.55"/>
        <path d="M6.5 12C8 11 10 10.4 12 10.4C14 10.4 16 11 17.5 12" stroke="#1e4fa8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
        <circle cx="12" cy="17.5" r="1.4" fill="#1e4fa8"/>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n'est pas encore disponible hors connexion. Vérifiez votre connexion internet puis réessayez.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
