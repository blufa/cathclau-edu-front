name: Deploy frontend

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.e.outputs.env }}
      api: ${{ steps.e.outputs.api }}
      site: ${{ steps.e.outputs.site }}
    steps:
      - id: e
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env=prod" >> "$GITHUB_OUTPUT"
            echo "api=https://api.ecole.jeccamtech.com/api/v1" >> "$GITHUB_OUTPUT"
            echo "site=https://ecole.jeccamtech.com" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "api=https://api-dev.ecole.jeccamtech.com/api/v1" >> "$GITHUB_OUTPUT"
            echo "site=https://dev.ecole.jeccamtech.com" >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  build-push:
    needs: [setup, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ needs.setup.outputs.api }}
            NEXT_PUBLIC_SITE_URL=${{ needs.setup.outputs.site }}
          tags: |
            ghcr.io/${{ env.OWNER }}/lacaeducation-frontend:${{ needs.setup.outputs.env }}
            ghcr.io/${{ env.OWNER }}/lacaeducation-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [setup, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/lacaeducation
            ENV=${{ needs.setup.outputs.env }}
            docker compose --env-file .env.$ENV -p laca-$ENV pull frontend
            # --force-recreate : sans ça, `up -d` peut garder l'ancien conteneur même si le tag pointe
            # maintenant vers une image différente (même bug vécu côté backend, voir deploy.yml du
            # dépôt backend) — touche dev ET prod, à chaque déploiement, silencieusement.
            docker compose --env-file .env.$ENV -p laca-$ENV up -d --force-recreate frontend
            docker image prune -f
