[package]
name = "jeccam-ecole"
version = "0.1.1"
description = "Jeccam École — ERP scolaire multi-tenant, mode desktop hors-ligne"
authors = ["Jeccam Tech"]
edition = "2021"
rust-version = "1.77"

[lib]
# Nécessaire pour que les tests mobiles/bindings puissent réutiliser `run()` — convention Tauri v2.
name = "jeccam_ecole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

# SQLite local (table encaissements_offline) — pilote SQL officiel Tauri, basé sur sqlx.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Auto-updater signé, pointant vers le manifeste hébergé sur Hostinger (voir tauri.conf.json).
tauri-plugin-updater = "2"

# Redémarre proprement l'application après l'installation d'une mise à jour.
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
